packages:
  - "apps/*"

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  unrs-resolver: true

ignoredBuiltDependencies:
  - '@scarf/scarf'

onlyBuiltDependencies:
  - "@nestjs/core"
  - "@swc/core"
  - "@prisma/client"
  - "@prisma/engines"
  - esbuild
  - prisma
  - unrs-resolver
