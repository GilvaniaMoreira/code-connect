name: Claude Code Review

# Desativado temporariamente — a conta Anthropic está sem créditos de API.
# Pra reativar em PRs: troca `workflow_dispatch` por:
#   pull_request:
#     types: [opened, synchronize, reopened]
# e confirma que o secret ANTHROPIC_API_KEY (workspace key) e
# ANTHROPIC_WORKSPACE_ID estão configurados.
on:
  workflow_dispatch:

jobs:
  claude-review:
    runs-on: ubuntu-latest
    # Fail fast if the API hangs — the SDK's default retry loop can burn ~3min
    # before giving up. Six minutes is enough for a real review, short enough
    # not to waste a slot when the model is unreachable.
    timeout-minutes: 6
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify Anthropic API key is present
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "${ANTHROPIC_API_KEY}" ]; then
            echo "::error::Secret ANTHROPIC_API_KEY is not set for this workflow context."
            exit 1
          fi
          echo "ANTHROPIC_API_KEY is present (length=${#ANTHROPIC_API_KEY})."

      - name: Run Claude Code Review
        # Identity-linked API keys (personal keys) require the workspace id
        # to be sent with every request; workspace-level keys don't. Setting
        # this env var lets the SDK add the `anthropic-workspace-id` header
        # so either key type works.
        env:
          ANTHROPIC_WORKSPACE_ID: ${{ secrets.ANTHROPIC_WORKSPACE_ID }}
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: '--model claude-sonnet-4-6 --max-turns 8'
          # Surface the full SDK output — without this, silent failures
          # (timeouts, model overload) show up as "is_error:true" with no
          # explanation, making triage impossible.
          show_full_output: true
          prompt: |
            Faça uma revisão técnica do pull request atual seguindo estas diretrizes:

            1. Qualidade de código: legibilidade, nomes claros, funções pequenas e coesas.
            2. Boas práticas: princípios SOLID, DRY, tratamento de erros e segurança
               (validação de entrada, injeção de SQL, exposição de segredos, XSS).
            3. Consistência com o restante do projeto — este monorepo pnpm tem
               `apps/api` em NestJS 11 e `apps/web` em React 19 + Vite + Tailwind
               (Atomic Design). Não há Next.js nem Prisma; ignore essas referências.
            4. Performance: N+1 em consultas, memoização desnecessária, re-renderizações.
            5. Testes: cobertura do comportamento alterado; sugira cenários faltantes.
            6. Sugira melhorias objetivas, mostrando trechos de código quando útil.

            Responda em português, comente diretamente nas linhas relevantes do diff quando possível
            e finalize com um resumo curto do que foi aprovado e do que precisa de ajuste.
